name: E2E

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

# Todo o ambiente nasce e morre neste job: Postgres e Mailpit como services,
# API e front rodando no próprio runner. Não há ambiente de teste hospedado e
# nenhum segredo é usado, então não existe credencial de produção aqui. Além
# disso, a API em NODE_ENV=test e o seed recusam banco ou SMTP que não sejam
# locais, e o Playwright recusa URLs que não sejam localhost.
env:
  NODE_VERSION: '24'
  E2E_API_URL: http://localhost:3334
  E2E_WEB_URL: http://localhost:4173
  E2E_MAILPIT_URL: http://localhost:8025

jobs:
  e2e:
    name: Run E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sgb_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.27
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v7

      # Uma PR do front que depende de uma do back costuma usar o mesmo nome de
      # branch: nesse caso testa contra ela; senão, contra a main do back.
      - name: Resolve Backend Branch
        id: backend
        run: |
          if git ls-remote --exit-code --heads https://github.com/SGB-PGCOMP-UFBA/sgb-backend.git "$HEAD_REF" > /dev/null; then
            echo "ref=$HEAD_REF" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi
          cat "$GITHUB_OUTPUT"
        env:
          HEAD_REF: ${{ github.head_ref }}

      - uses: actions/checkout@v7
        with:
          repository: SGB-PGCOMP-UFBA/sgb-backend
          ref: ${{ steps.backend.outputs.ref }}
          path: backend

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Prepare Backend
        working-directory: backend
        run: |
          cp .env.e2e.example .env
          npm ci
          npm run build
          npm run db:migrate
          npm run db:seed:e2e
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sgb_e2e

      - name: Start Backend
        working-directory: backend
        run: |
          nohup node dist/main > ../backend.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -s -o /dev/null "$E2E_API_URL"; then exit 0; fi
            sleep 1
          done
          cat ../backend.log
          exit 1
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/sgb_e2e

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      # O Playwright sobe o Vite (webServer) apontando para a API acima.
      - name: Run E2E
        run: npm run test:e2e

      - name: Upload Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
            backend.log
          retention-days: 7
